<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid Folders</title>
<meta name="description" content="Make your macOS folders Liquid Glass. Free and open source.">
<meta property="og:title" content="Liquid Folders">
<meta property="og:description" content="Make your macOS folders Liquid Glass.">
<meta property="og:image" content="https://zupersun.github.io/liquid-folders/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="icon.png">
<style>
  :root {
    --ink: #f4f6fa;
    --muted: rgba(244, 246, 250, 0.62);
    --rim: rgba(255, 255, 255, 0.22);
    --night: #0c1018;
    --rest: 402px; /* height of everything but the video, so the video fills what's left */
  }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body {
    margin: 0;
    min-height: 100vh;
    color: var(--ink);
    font: 400 16px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  /* The demo's own Desktop, blurred, behind everything: the page sits on the wallpaper like the folders do. */
  .wallpaper {
    position: fixed; inset: -60px; z-index: -1;
    background: url(poster.jpg) center / cover;
    filter: blur(48px) saturate(1.25) brightness(0.55);
  }
  /* One screen, no scroll: the video takes whatever height the rest leaves. */
  main { min-height: 100vh; min-height: 100svh; padding: 36px 16px 24px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; }

  header { text-align: center; }
  h1 {
    margin: 0;
    font: 700 clamp(40px, 6vw, 60px)/1.1 -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
    letter-spacing: -0.025em;
  }
  .tagline { margin: 8px 0 0; font-size: 18px; color: var(--muted); }

  /* Liquid glass: frost, rim light and a specular sheen. */
  .glass {
    position: relative; isolation: isolate;
    background: rgba(18, 20, 24, 0.22);
    -webkit-backdrop-filter: blur(16px) saturate(170%);
    backdrop-filter: blur(16px) saturate(170%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.42), inset 0 -1px 0 rgba(255, 255, 255, 0.1),
                inset 1px 0 0 rgba(255, 255, 255, 0.14), inset -1px 0 0 rgba(255, 255, 255, 0.14),
                0 10px 34px rgba(0, 0, 0, 0.28);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 38%, rgba(255, 255, 255, 0) 70%, rgba(255, 255, 255, 0.08));
  }

  /* Sized so the window's bottom edge cuts through it (about 80% showing), inviting a scroll. */
  .demo {
    width: min(100%, 1280px, calc((100vh - var(--rest)) * 1660 / 1080 + 16px));
    width: min(100%, 1280px, calc((100svh - var(--rest)) * 1660 / 1080 + 16px));
    margin: 28px auto 0; padding: 8px; border-radius: 22px;
  }
  .demo video { display: block; width: 100%; height: auto; aspect-ratio: 1660 / 1080; border-radius: 15px; background: #000; }

  .get { margin-top: 24px; text-align: center; }
  .step { margin: 0 0 12px; font-size: 15px; color: var(--muted); }
  .step b { font-weight: 600; color: var(--ink); }
  .copy {
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px 30px; border: 0; border-radius: 999px; cursor: pointer; white-space: nowrap; overflow: hidden;
    color: var(--ink); font: 600 17px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    /* Glass gives like a drop: squeezed on press, then springs to the new label's width. */
    transition: transform 0.25s cubic-bezier(0.3, 1.6, 0.5, 1), width 0.45s cubic-bezier(0.3, 1.35, 0.5, 1), background 0.2s;
  }
  .copy:hover { background: rgba(255, 255, 255, 0.16); transform: translateY(-1px); }
  .copy:active { transform: scale(0.94); transition-duration: 0.1s; }
  .copy:focus-visible, footer a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .copy svg { width: 18px; height: 18px; flex: none; }
  .requires { margin: 14px 0 0; font-size: 14px; color: var(--muted); }

  footer { margin-top: 24px; text-align: center; font-size: 14px; color: var(--muted); }
  footer a { color: var(--muted); text-decoration: none; border-bottom: 1px solid var(--rim); }
  footer a:hover { color: var(--ink); border-color: var(--ink); }

  /* Page load: rise in, staggered. */
  .rise { animation: rise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .rise:nth-child(2) { animation-delay: 0.08s; }
  .rise:nth-child(3) { animation-delay: 0.16s; }
  .rise:nth-child(4) { animation-delay: 0.24s; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  @media (prefers-reduced-motion: reduce) { .rise { animation: none; } .copy { transition: none; } }

</style>
</head>
<body>
<div class="wallpaper" aria-hidden="true"></div>
<main>
  <header class="rise">
    <h1>Liquid Folders</h1>
    <p class="tagline">Make your macOS folders Liquid Glass</p>
  </header>

  <div class="demo glass rise">
    <video src="video.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="metadata"
           aria-label="Folders on a Mac Desktop turning into Liquid Glass"></video>
  </div>

  <section class="get rise">
    <p class="step">Copy → Paste into <b>Terminal</b> → Run</p>
    <button class="copy glass" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
      <span>Copy command</span>
    </button>
    <p class="requires">macOS 26 (Tahoe) or later · Apple silicon or Intel</p>
  </section>

  <footer class="rise">
    2026 @ <a href="https://github.com/zupersun/liquid-folders">zupersun</a>
  </footer>
</main>
<script>
  const command = "curl -fsSL https://raw.githubusercontent.com/zupersun/liquid-folders/main/install.sh | zsh";
  const copy = document.querySelector(".copy"), label = copy.querySelector("span"), icon = copy.querySelector("svg");
  const copyIcon = icon.innerHTML, checkIcon = '<path d="M5 12.5 10 17 19 7"/>';
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let reset;
  // Width can't animate to "auto": measure the new label, then animate from the old width to it.
  function show(text, glyph) {
    const from = copy.offsetWidth;
    label.textContent = text;
    icon.innerHTML = glyph;
    copy.style.width = "";
    const to = copy.offsetWidth;
    copy.style.width = from + "px";
    copy.offsetWidth;  // lay out at the old width first
    copy.style.width = to + "px";
    if (!still) [label, icon].forEach(part => part.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 300, easing: "ease-out" }));
  }
  function copyOldWay() {
    const field = Object.assign(document.createElement("textarea"), { value: command });
    document.body.append(field); field.select(); document.execCommand("copy"); field.remove();
  }
  copy.addEventListener("click", () => {
    if (navigator.clipboard) navigator.clipboard.writeText(command).catch(copyOldWay); else copyOldWay();
    show("Copied", checkIcon);  // at once, not after the clipboard answers
    clearTimeout(reset);
    reset = setTimeout(() => show("Copy command", copyIcon), 2000);
  });
  if (still) {
    const video = document.querySelector("video");
    video.removeAttribute("autoplay");
    video.pause();
    video.controls = true;
  }
</script>
</body>
</html>
